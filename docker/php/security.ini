; ==============================================================================
; Hardening de Seguranca PHP - Engine.Core / cezinhasilva.com
; ==============================================================================

; Oculta a versao do PHP no cabecalho HTTP (evita X-Powered-By: PHP/8.2.x)
expose_php = Off

; Impede a inclusao remota de arquivos via URL (RCE prevention)
allow_url_include = Off

; Oculta erros em tela para evitar vazamento de informacoes internas e caminhos
display_errors = Off
display_startup_errors = Off
log_errors = On

; Bloqueia funcoes de execucao direta no sistema operacional
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source

; Restringe limites de upload e execucao
max_execution_time = 60
memory_limit = 256M
post_max_size = 20M
upload_max_filesize = 10M
