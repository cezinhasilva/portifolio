<VirtualHost *:80>
    ServerName localhost
    HostnameLookups Off
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Oculta assinatura do servidor nas respostas
    ServerSignature Off

    <Directory /var/www/html/public>
        # Desativa listagem de diretorios
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # CI4 URL Rewrite
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [L]
    </Directory>

    # Headers de Seguranca Base
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS Headers
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With, X-API-KEY"
    Header always set Access-Control-Max-Age "3600"

    # Handle preflight OPTIONS
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
