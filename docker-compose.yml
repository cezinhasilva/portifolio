services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cez_web
    ports:
      - "${BACKEND_PORT:-8085}:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
      - database.default.hostname=db
      - database.default.database=${DB_NAME:-cezinhasilva}
      - database.default.username=${DB_USER:-cez_user}
      - database.default.password=${DB_PASS:-cez_pass_2026}
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cez_network

  db:
    image: mysql:8.0
    container_name: cez_db
    restart: always
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-cezinhasilva}
      MYSQL_USER: ${DB_USER:-cez_user}
      MYSQL_PASSWORD: ${DB_PASS:-cez_pass_2026}
    volumes:
      - cez_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_pass_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cez_network

volumes:
  cez_db_data:
    driver: local

networks:
  cez_network:
    driver: bridge
